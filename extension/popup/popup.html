<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="player" hidden>
    <img id="art" alt="" hidden>
    <div class="info">
      <div id="title" class="title"></div>
      <div id="artist" class="artist"></div>
    </div>
    <div class="controls">
      <button id="previous" title="Previous" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="toggle" class="primary" title="Play/Pause" aria-label="Play/Pause">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button id="next" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>
    <button id="show-tab" class="link">Go to Amazon Music tab</button>
  </main>
  <p id="empty" class="empty" hidden>Nothing is playing in Amazon Music.</p>
  <div id="no-access" class="empty" hidden>
    <p>This extension's access to Amazon Music sites is switched off.</p>
    <button id="grant" class="grant">Allow access</button>
  </div>
  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
